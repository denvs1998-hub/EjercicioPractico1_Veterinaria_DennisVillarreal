
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Citas Veterinarias</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body>

        <!-- Encabezado -->
        <div th:replace="~{fragmentos/header :: header}"></div>

        <!-- Menú de navegación -->
        <div th:replace="~{fragmentos/menu :: menu}"></div>

        <div class="container mt-4">

            <h2>Formulario de Citas Veterinarias</h2>

            <form th:action="@{/cita/guardar}"
                  th:object="${cita}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">
                        Nombre de la Mascota
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombreMascota}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nombre del Propietario
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombrePropietario}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date"
                           class="form-control"
                           th:field="*{fecha}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Servicio Veterinario
                    </label>
                    <select class="form-select"
                            th:field="*{servicio.id}"
                            required>

                        <option value="">
                            Seleccione un servicio
                        </option>

                        <option th:each="servicio : ${servicios}"
                                th:value="${servicio.id}"
                                th:text="${servicio.nombre}">
                        </option>

                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/cita/listado}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

        <!-- Pie de página -->
        <div th:replace="~{fragmentos/footer :: footer}"></div>

    </body>
</html>
