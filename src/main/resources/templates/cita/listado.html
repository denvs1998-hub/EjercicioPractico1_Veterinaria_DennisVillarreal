
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Citas Veterinarias</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body>

        <div th:replace="~{fragmentos/header :: header}"></div>
        <div th:replace="~{fragmentos/menu :: menu}"></div>

        <div class="container mt-4">

            <h2>Citas Veterinarias</h2>

            <a th:href="@{/cita/nuevo}"
               class="btn btn-primary mb-3">
                Nueva Cita
            </a>

            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre Mascota</th>
                        <th>Nombre Propietario</th>
                        <th>Fecha</th>
                        <th>Servicio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.id}"></td>
                        <td th:text="${cita.nombreMascota}"></td>
                        <td th:text="${cita.nombrePropietario}"></td>
                        <td th:text="${cita.fecha}"></td>
                        <td th:text="${cita.servicio.nombre}"></td>
                        <td>
                            <a th:href="@{/cita/modificar/{id}(id=${cita.id})}"
                               class="btn btn-warning btn-sm">
                                Modificar
                            </a>

                            <a th:href="@{/cita/eliminar/{id}(id=${cita.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Está seguro de eliminar esta cita?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

        <div th:replace="~{fragmentos/footer :: footer}"></div>

    </body>
</html>
