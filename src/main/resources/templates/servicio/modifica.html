
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Servicio Veterinario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body>

        <div th:replace="~{fragmentos/header :: header}"></div>
        <div th:replace="~{fragmentos/menu :: menu}"></div>

        <div class="container mt-4">

            <h2>Registro de Servicio Veterinario</h2>

            <form th:action="@{/servicio/guardar}"
                  th:object="${servicio}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{precio}"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duración (minutos)</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{duracionMinutos}"
                           min="1"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de Servicio</label>
                    <select class="form-select"
                            th:field="*{tipoServicio}"
                            required>
                        <option value="">Seleccione un tipo</option>
                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo.id}"
                                th:text="${tipo.nombre}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/servicio/listado}"
                   class="btn btn-secondary">
                    Regresar
                </a>

            </form>

        </div>

        <div th:replace="~{fragmentos/footer :: footer}"></div>

    </body>
</html>
