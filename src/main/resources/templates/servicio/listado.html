
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Servicios Veterinarios</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body>

        <div th:replace="~{fragmentos/header :: header}"></div>
        <div th:replace="~{fragmentos/menu :: menu}"></div>

        <div class="container mt-4">

            <h2>Servicios Veterinarios</h2>

            <!-- Mensaje de éxito -->
            <div th:if="${mensaje}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar">
                </button>
            </div>

            <a th:href="@{/servicio/nuevo}"
               class="btn btn-primary mb-3">
                Nuevo Servicio
            </a>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Duración (minutos)</th>
                        <th>Tipo de Servicio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.id}"></td>
                        <td th:text="${servicio.nombre}"></td>
                        <td th:text="${servicio.precio}"></td>
                        <td th:text="${servicio.duracionMinutos}"></td>
                        <td th:text="${servicio.tipoServicio.nombre}"></td>

                        <td>
                            <a th:href="@{/servicio/modificar/{id}(id=${servicio.id})}"
                               class="btn btn-warning btn-sm">
                                Modificar
                            </a>

                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal"
                                    th:attr="data-bs-target='#eliminarModal' + ${servicio.id}">
                                Eliminar
                            </button>

                            <!-- Modal de confirmación -->
                            <div class="modal fade"
                                 th:id="'eliminarModal' + ${servicio.id}"
                                 tabindex="-1"
                                 aria-hidden="true">

                                <div class="modal-dialog">
                                    <div class="modal-content">

                                        <div class="modal-header">
                                            <h5 class="modal-title">
                                                Confirmar eliminación
                                            </h5>

                                            <button type="button"
                                                    class="btn-close"
                                                    data-bs-dismiss="modal">
                                            </button>
                                        </div>

                                        <div class="modal-body">
                                            ¿Está seguro de que desea eliminar
                                            el servicio
                                            <strong th:text="${servicio.nombre}"></strong>?
                                        </div>

                                        <div class="modal-footer">
                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    data-bs-dismiss="modal">
                                                Cancelar
                                            </button>

                                            <a th:href="@{/servicio/eliminar/{id}(id=${servicio.id})}"
                                               class="btn btn-danger">
                                                Eliminar
                                            </a>
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

        <div th:replace="~{fragmentos/footer :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
