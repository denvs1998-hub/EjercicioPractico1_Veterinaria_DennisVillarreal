
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Tipo de Servicio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body>

        <div th:replace="~{fragmentos/header :: header}"></div>
        <div th:replace="~{fragmentos/menu :: menu}"></div>

        <div class="container mt-4">

            <h2>Registro de Tipo de Servicio</h2>

            <form th:action="@{/tipoServicio/guardar}"
                  th:object="${tipoServicio}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{descripcion}">
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/tipoServicio/listado}"
                   class="btn btn-secondary">
                    Regresar
                </a>

            </form>

        </div>

        <div th:replace="~{fragmentos/footer :: footer}"></div>

    </body>
</html>
